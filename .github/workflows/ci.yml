name: ci
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: pip install "cryptography>=45" pytest
      - run: make test
      - run: make faultinj
      - run: make fuzz FUZZ_SECONDS=60
